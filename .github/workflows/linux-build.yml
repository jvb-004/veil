name: Linux build

on:
  workflow_dispatch:
  push:
    paths:
      - 'linux/**'
      - 'core/**'
      - '.github/workflows/linux-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
      # No system dev packages needed: rustls instead of openssl, and audio is
      # pw-record at runtime rather than a linked library.
      # The whole workspace builds on Linux: the Windows crates are target-gated
      # down to a stub main, so a cross-platform break shows up here immediately.
      - name: Build
        run: cargo build --release --workspace --all-targets
      - name: Test
        run: cargo test --release --workspace
      # Advisory: clippy-driver needs an upstream rust-std and sysroot that a
      # distro-packaged toolchain does not provide, so it cannot be run on the
      # dev machine and gating on it would mean fixing lints blind from logs.
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --release --workspace --all-targets
      # A gate: rustfmt runs locally, so there is no excuse for drift.
      - name: Format
        run: cargo fmt --all --check
      - name: Extension syntax
        working-directory: linux/gnome-extension
        run: |
          sed 's|^import .*$||' extension.js | sed 's|^export default class|class|' > /tmp/check.mjs
          node --check /tmp/check.mjs
          node -e "JSON.parse(require('fs').readFileSync('metadata.json'))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veil-daemon-linux
          path: target/release/veil-daemon
          if-no-files-found: warn
