name: macOS app build

on:
  workflow_dispatch:
  push:
    paths:
      - 'macos/Veil/**'
      - '.github/workflows/macos-build.yml'

jobs:
  build:
    name: build ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - name: Build
        working-directory: macos/Veil
        run: |
          # A bare pipe into tail returns tail's exit status, which is always 0.
          # That turned three compile errors into a green check once already.
          set -o pipefail
          swift build -c release 2>&1 | tail -80
      - name: Confirm the Info.plist made it into the binary
        working-directory: macos/Veil
        run: |
          set -o pipefail
          otool -P .build/release/Veil | head -30
      - name: Smoke run (launches, prints, exits)
        working-directory: macos/Veil
        run: |
          # No TCC consent on a runner, so audio will fail. That is fine: we are
          # checking that it starts, wires up and logs rather than crashing.
          ./.build/release/Veil &
          PID=$!
          sleep 6
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "process died within 6 seconds"; exit 1
          fi
          kill "$PID" 2>/dev/null || true
          echo "survived 6 seconds"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veil-${{ matrix.runner }}
          path: macos/Veil/.build/release/Veil
          if-no-files-found: warn
