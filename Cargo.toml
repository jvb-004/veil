# One workspace, one core. The trigger heuristics, the transcript and the
# answering logic exist exactly once and every platform links the same copy.
[workspace]
resolver = "2"
members = ["core", "linux/veil-daemon", "windows/veil-windows", "windows/probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
veil-core = { path = "core" }
